<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>読み込み中...</title>
    <style>
        body { background: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: sans-serif; color: #333; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #ff0050; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader"></div>

    <script>
        // 【重要】ここに最新の招待URLを貼り付けてください
        const inviteUrl = "https://lite.tiktok.com/t/ZS91bXeyuRVEj-gqCrx/";

        function launchApp() {
            // ページを開いた瞬間にリダイレクト（自動遷移）を実行
            window.location.replace(inviteUrl);
        }

        // 画面読み込みが完了したら即実行
        window.onload = launchApp;

        // もし自動で飛ばない場合、0.5秒後にもう一度実行（念押し）
        setTimeout(launchApp, 500);
    </script>
</body>
</html>
